name: Release

# Pushing a tag like v1.2.3 builds the exe and publishes it to GitHub Releases.
# Installed apps check releases/latest daily, so users pick it up automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Cargo.toml version matches the tag
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Cargo.toml is v$v but the tag is ${{ github.ref_name }}" }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/taskbar-monitor.exe .
          $hash = (Get-FileHash taskbar-monitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  taskbar-monitor.exe" | Set-Content taskbar-monitor.exe.sha256 -Encoding utf8NoBOM

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" taskbar-monitor.exe taskbar-monitor.exe.sha256 --title "${{ github.ref_name }}" --generate-notes
