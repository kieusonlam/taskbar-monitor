name: Release

# Đẩy tag dạng v1.2.3 thì build exe và đăng lên GitHub Releases.
# App của người dùng tự kiểm tra releases/latest mỗi ngày nên sẽ nhận bản này.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra version trong Cargo.toml khớp tag
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Cargo.toml là v$v nhưng tag là ${{ github.ref_name }}" }

      - name: Build
        run: cargo build --release --locked

      - name: Đóng gói
        shell: pwsh
        run: |
          Copy-Item target/release/taskbar-monitor.exe .
          $hash = (Get-FileHash taskbar-monitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  taskbar-monitor.exe" | Set-Content taskbar-monitor.exe.sha256 -Encoding utf8NoBOM

      - name: Tạo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" taskbar-monitor.exe taskbar-monitor.exe.sha256 --title "${{ github.ref_name }}" --generate-notes
